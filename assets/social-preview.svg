<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="osbornec/video-transcription: Turn videos, Looms, and podcasts into verified agent knowledge">
  <defs>
    <clipPath id="verified-card-clip">
      <rect x="740" y="274" width="476" height="302" rx="6" />
    </clipPath>
  </defs>

  <!-- Asymmetric studio split canvas -->
  <rect width="1280" height="640" fill="#FFFFFF" />
  <rect x="692" y="0" width="588" height="640" fill="#F1F5F9" />
  <line x1="692" y1="0" x2="692" y2="640" stroke="#CBD5E1" stroke-width="1" />

  <!-- Left column: Positioning & install -->
  <text x="64" y="84" fill="#475569" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">osbornec / video-transcription</text>

  <text x="64" y="168" fill="#0F172A" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.6">Turn videos, Looms</text>
  <text x="64" y="222" fill="#0F172A" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.6">&amp; podcasts into verified</text>
  <text x="64" y="276" fill="#0F172A" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.6">agent knowledge.</text>

  <text x="64" y="340" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Gemini 4 multimodal understanding + multi-pass verification.</text>
  <text x="64" y="370" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Ready for people to read and for agents to build from.</text>

  <rect x="64" y="430" width="478" height="58" rx="6" fill="#0F172A" />
  <text x="90" y="465" fill="#F8FAFC" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace" font-size="17" font-weight="600">npx skills add osbornec/video-transcription</text>

  <text x="64" y="534" fill="#475569" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Google Antigravity, Claude Code, Codex, and Cursor</text>

  <!-- Right studio panel: Before / After transcript artifact -->
  <!-- Before block: Auto-captions & one-shot tools -->
  <rect x="740" y="64" width="476" height="178" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="768" y="102" fill="#475569" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Auto-captions &amp; one-shot tools</text>

  <text x="768" y="140" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Speaker 1:</text>
  <text x="768" y="172" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">"...we saw a jump in</text>
  <rect x="918" y="151" width="94" height="28" rx="4" fill="#FEE2E2" />
  <text x="925" y="171" fill="#B91C1C" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace" font-size="15" font-weight="600">[unclear]</text>
  <text x="1020" y="172" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">right after</text>
  <text x="768" y="202" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">the release shipped."</text>

  <!-- After block: Verified, themed Markdown sheet -->
  <g clip-path="url(#verified-card-clip)">
    <rect x="740" y="274" width="476" height="302" fill="#FFFFFF" />
    <rect x="740" y="274" width="476" height="5" fill="#0F766E" />
  </g>
  <rect x="740" y="274" width="476" height="302" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1" />

