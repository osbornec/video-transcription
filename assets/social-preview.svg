    <rect x="1133" y="296" width="3" height="22" rx="1" />
    <rect x="1140" y="301" width="3" height="12" rx="1" />
    <rect x="1147" y="299" width="3" height="16" rx="1" />
    <rect x="1154" y="303" width="3" height="8" rx="1" />
