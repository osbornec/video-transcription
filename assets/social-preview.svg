  <text x="768" y="356" fill="#0F766E" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace" font-size="16" font-weight="700">### 1. Checkout Reliability</text>

  <text x="768" y="394" fill="#475569" font-family="'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace" font-size="14" font-weight="600">[04:12]</text>
  <text x="836" y="394" fill="#0F172A" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Maya Lin</text>
  <text x="916" y="394" fill="#475569" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">(verified on screen):</text>

  <text x="768" y="430" fill="#1E293B" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">"...we saw a jump in</text>
  <rect x="918" y="409" width="144" height="28" rx="4" fill="#CCFBF1" />
  <text x="925" y="429" fill="#115E59" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">checkout retries</text>
  <text x="768" y="462" fill="#1E293B" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">right after the release shipped."</text>

  <line x1="768" y1="494" x2="1188" y2="494" stroke="#E2E8F0" stroke-width="1" />
  <text x="768" y="524" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Speaker names read on screen. Unclear spans re-checked in audio.</text>
  <text x="768" y="548" fill="#334155" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Reusable Markdown &amp; Google Docs for teams and their agents.</text>
</svg>
